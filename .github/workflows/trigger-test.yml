name: "[진단용][임시] Push Trigger Test"

# =============================================================================
# ⚠️ 임시 진단용 워크플로우 - 진단 완료 후 반드시 삭제할 것 ⚠️
#
# 목적: daily-brief.yml의 schedule 이벤트가 발동하지 않는 문제를 진단하기 위해,
# "이 저장소에서 GitHub의 자동(비수동) 트리거가 애초에 정상 동작하는지"를
# schedule과 무관한 가장 단순한 트리거(push)로 독립적으로 확인한다.
#
# 이 워크플로우는 daily-brief.yml과 완전히 분리되어 있다:
#   - news_fetcher.py, ai_client.py, generate_brief.py 등 어떤 스크립트도
#     호출하지 않는다.
#   - Tavily/Gemini API를 포함해 어떤 외부 API도 호출하지 않는다.
#   - 어떤 secrets/vars도 참조하지 않는다.
#   - reports/, data/ 등 어떤 파일도 만들거나 커밋하지 않는다.
#   - echo 한 줄만 실행한다. 비용이 전혀 발생하지 않는다.
# =============================================================================
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  trigger-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 자동 트리거 발동 여부 출력
        run: echo "AUTOMATIC PUSH TRIGGER WORKS"

      - name: 트리거 상세 정보 출력 (진단용, 민감정보 없음)
        run: |
          echo "event_name: ${{ github.event_name }}"
          echo "ref: ${{ github.ref }}"
          echo "actor: ${{ github.actor }}"
          echo "sha: ${{ github.sha }}"
