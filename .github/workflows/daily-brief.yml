name: Daily Morning Brief 자동 생성

# =============================================================================
# ⚠️ 임시 테스트 설정 (schedule 자동 발동 여부 확인용 - 순수 UTC cron 재검증) ⚠️
# =============================================================================
# 1차 테스트: cron + timezone(Asia/Seoul) 조합("12:50 KST")을 시도했으나
#   12:50 KST 이후에도 Scheduled 실행 기록이 생성되지 않았다.
# 2차 시도: timezone 필드를 완전히 제거하고, 동일한 순간(12:50 KST = 03:50 UTC)을
#   순수 UTC cron("50 3 * * *")으로 재표기했으나, 오늘(2026-08-14) 안에
#   재검증할 수 있는 시각이 이미 지나 있었다(다음 발동이 익일로 밀림).
# 3차(현재) 테스트: 오늘 안에 즉시 재검증하기 위해, "현재 시각 + 15분"을
#   기준으로 새로 계산한 시각을 순수 UTC cron으로 지정한다. timezone 필드는
#   여전히 사용하지 않는다.
#
#   설정 시각(KST) : 2026-08-14 13:05
#   테스트 목표 시각: 2026-08-14 13:20 KST = 2026-08-14 04:20 UTC (설정 시각 + 15분)
#   cron(UTC)      : "20 4 * * *"
#
# ▶ 테스트 확인 후 원래 운영 설정(매일 07:45 KST)으로 되돌릴 것:
#     cron: "45 22 * * *"   (순수 UTC, 매일 07:45 KST와 동일한 순간)
# =============================================================================
on:
  schedule:
    - cron: "45 22 * * *"
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "이미 존재하는 보고서를 강제로 재생성할지 여부 (true/false)"
        required: false
        default: "false"
      target_date:
        description: "보고서 기준일을 직접 지정 (YYYY-MM-DD). 비워두면 실행일-1일을 사용."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt

      - name: 의존성 설치 확인 (google-genai)
        run: |
          set -e
          python -c "
          import importlib.metadata as m
          import google.genai  # noqa: F401  (import 자체가 되는지 확인)
          print('google-genai 설치 확인 완료, 버전:', m.version('google-genai'))
          "

      - name: 필수 환경변수 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: |
          set -e
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret이 설정되어 있지 않습니다."
            exit 1
          fi
          if [ -z "$SEARCH_API_KEY" ]; then
            echo "::error::SEARCH_API_KEY secret이 설정되어 있지 않습니다."
            exit 1
          fi
          echo "필수 환경변수 확인 완료."

      - name: Daily Morning Brief 생성
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SEARCH_API_URL: ${{ vars.SEARCH_API_URL }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate || 'false' }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          python scripts/generate_brief.py

      - name: 보고서 목록(data/reports.json) 갱신
        run: |
          python scripts/update_index.py

      - name: 변경사항 확인
        id: git-diff
        run: |
          git add reports data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경된 파일이 없습니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 커밋 및 푸시
        if: steps.git-diff.outputs.changed == 'true'
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          TARGET_DATE_LABEL=$(date -u -d '9 hours ago' +'%Y-%m-%d' 2>/dev/null || date +'%Y-%m-%d')
          git commit -m "chore: add daily morning brief (auto, ${TARGET_DATE_LABEL})"
          git push
