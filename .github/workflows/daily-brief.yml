name: Daily Morning Brief 자동 생성

# 매일 오전 7:45(Asia/Seoul, KST) 자동 실행 + 언제든 수동 실행(workflow_dispatch) 가능.
#
# GitHub Actions는 2026-03부터 schedule 트리거에 IANA 타임존을 직접 지정하는
# `timezone:` 필드를 지원한다(cron과 같은 리스트 항목의 형제 키로 작성).
# 이를 사용하면 cron 표현식 자체를 그 타임존의 "현지 시각" 그대로 쓸 수 있어
# UTC 환산 실수를 방지할 수 있다. 아래 cron("45 7 * * *")은 그 자체로
# "매일 07:45"를 의미하며, timezone: Asia/Seoul과 결합되어 정확히
# "매일 07:45 KST"에 실행된다. 한국은 서머타임을 쓰지 않으므로 연중 이 설정
# 그대로 유지된다(참고: UTC로 환산하면 매일 22:45 UTC와 동일하다).
on:
  schedule:
    - cron: "45 7 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "이미 존재하는 보고서를 강제로 재생성할지 여부 (true/false)"
        required: false
        default: "false"
      target_date:
        description: "보고서 기준일을 직접 지정 (YYYY-MM-DD). 비워두면 실행일-1일을 사용."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt

      - name: 의존성 설치 확인 (google-genai)
        run: |
          set -e
          python -c "
          import importlib.metadata as m
          import google.genai  # noqa: F401  (import 자체가 되는지 확인)
          print('google-genai 설치 확인 완료, 버전:', m.version('google-genai'))
          "

      - name: 필수 환경변수 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: |
          set -e
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret이 설정되어 있지 않습니다."
            exit 1
          fi
          if [ -z "$SEARCH_API_KEY" ]; then
            echo "::error::SEARCH_API_KEY secret이 설정되어 있지 않습니다."
            exit 1
          fi
          echo "필수 환경변수 확인 완료."

      - name: Daily Morning Brief 생성
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SEARCH_API_URL: ${{ vars.SEARCH_API_URL }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate || 'false' }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          python scripts/generate_brief.py

      - name: 보고서 목록(data/reports.json) 갱신
        run: |
          python scripts/update_index.py

      - name: 변경사항 확인
        id: git-diff
        run: |
          git add reports data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경된 파일이 없습니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 커밋 및 푸시
        if: steps.git-diff.outputs.changed == 'true'
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          TARGET_DATE_LABEL=$(date -u -d '9 hours ago' +'%Y-%m-%d' 2>/dev/null || date +'%Y-%m-%d')
          git commit -m "chore: add daily morning brief (auto, ${TARGET_DATE_LABEL})"
          git push
