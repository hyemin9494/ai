name: Daily Morning Brief 자동 생성

# =============================================================================
# ⚠️ 임시 테스트 설정 (schedule 자동 발동 여부 확인용) ⚠️
# =============================================================================
# 아래 cron은 "매일 07:45 KST 자동 실행"이라는 원래 운영 설정이 아니라,
# GitHub Actions의 schedule 이벤트가 실제로 자동 발동하는지 오늘 즉시 확인하기
# 위한 1회성 테스트 값이다.
#
#   설정 시각(KST) : 2026-08-14 12:35 (Asia/Seoul)
#   테스트 실행 예정: 2026-08-14 12:50 KST (설정 시각으로부터 약 15분 뒤)
#   원래 운영 설정  : cron: "45 7 * * *"  /  timezone: "Asia/Seoul"  (매일 07:45 KST)
#
# ▶ 테스트가 끝나면 아래 cron 줄을 반드시 "45 7 * * *"로 되돌려야 한다
#   (timezone 줄은 변경할 필요 없음 - 그대로 Asia/Seoul 유지).
# =============================================================================
on:
  schedule:
    - cron: "50 12 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "이미 존재하는 보고서를 강제로 재생성할지 여부 (true/false)"
        required: false
        default: "false"
      target_date:
        description: "보고서 기준일을 직접 지정 (YYYY-MM-DD). 비워두면 실행일-1일을 사용."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt

      - name: 의존성 설치 확인 (google-genai)
        run: |
          set -e
          python -c "
          import importlib.metadata as m
          import google.genai  # noqa: F401  (import 자체가 되는지 확인)
          print('google-genai 설치 확인 완료, 버전:', m.version('google-genai'))
          "

      - name: 필수 환경변수 확인
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        run: |
          set -e
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret이 설정되어 있지 않습니다."
            exit 1
          fi
          if [ -z "$SEARCH_API_KEY" ]; then
            echo "::error::SEARCH_API_KEY secret이 설정되어 있지 않습니다."
            exit 1
          fi
          echo "필수 환경변수 확인 완료."

      - name: Daily Morning Brief 생성
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SEARCH_API_URL: ${{ vars.SEARCH_API_URL }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate || 'false' }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          python scripts/generate_brief.py

      - name: 보고서 목록(data/reports.json) 갱신
        run: |
          python scripts/update_index.py

      - name: 변경사항 확인
        id: git-diff
        run: |
          git add reports data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경된 파일이 없습니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 커밋 및 푸시
        if: steps.git-diff.outputs.changed == 'true'
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          TARGET_DATE_LABEL=$(date -u -d '9 hours ago' +'%Y-%m-%d' 2>/dev/null || date +'%Y-%m-%d')
          git commit -m "chore: add daily morning brief (auto, ${TARGET_DATE_LABEL})"
          git push
